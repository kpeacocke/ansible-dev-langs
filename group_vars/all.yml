---
# Languages this playbook currently knows how to install.
# Add a new name here plus roles/dev_languages/tasks/<name>/*.yml to extend.
supported_languages:
  - python
  - c
  - c++
  - java
  - javascript
  - typescript
  - go
  - rust
  - powershell
  - perl
  - c#
  - visual_basic
  - r
  - php
  - ada
  - vbscript
  - ruby
  - lua
  - swift
  - objective_c

default_python_version: latest
default_pip_version: latest
default_pipx_version: latest
default_python_tools:
  - uv
  - poetry
  - hatch
  - pytest
  - ruff
  - mypy
  - debugpy
  - ipython
default_c_tools:
  - build
  - format
  - lint
  - pkg_config
default_cpp_tools:
  - build
  - format
  - lint
  - pkg_config
  - language_server
  - debugger
  - cache
default_java_distribution: temurin
default_java_version: latest
default_java_tools:
  - maven
  - gradle
default_javascript_version: latest
default_javascript_tools:
  - npm
  - pnpm
  - yarn
  - eslint
  - prettier
  - npm-check-updates
default_typescript_version: latest
default_typescript_tools:
  - typescript
  - ts-node
  - tsx
default_go_version: latest
default_go_tools:
  - gopls
  - delve
  - govulncheck
  - gofumpt
default_rust_version: latest
default_rust_tools:
  - rust-analyzer
  - rustfmt
  - clippy
  - cargo-audit
  - cargo-deny
  - cargo-nextest
default_powershell_version: latest
default_powershell_tools:
  - PSScriptAnalyzer
  - Pester
  - PSReadLine
default_perl_version: latest
default_perl_tools:
  - Perl::Critic
  - Perl::Tidy
  - Perl::LanguageServer
default_csharp_version: latest
default_csharp_tools:
  - dotnet-format
  - csharpier
  - dotnet-outdated-tool
default_visual_basic_version: latest
default_visual_basic_tools:
  - dotnet-format
  - dotnet-outdated-tool
default_r_version: latest
default_r_tools:
  - pak
  - renv
  - lintr
  - styler
  - languageserver
  - testthat
default_php_version: latest
default_php_tools:
  - composer
  - phpunit/phpunit
  - friendsofphp/php-cs-fixer
  - phpstan/phpstan
  - vimeo/psalm
  - rector/rector
default_ada_version: latest
default_ada_tools:
  - build
  - check
  - format
default_vbscript_version: latest
default_vbscript_tools:
  - cscript
  - wscript
default_ruby_version: latest
default_ruby_tools:
  - bundler
  - rake
  - rubocop
  - rspec
  - solargraph
default_lua_version: latest
default_lua_tools:
  - luarocks
  - luacheck
  - busted
  - luaformatter
default_swift_version: latest
default_swift_tools:
  - swift-format
  - sourcekit-lsp
default_objective_c_version: latest
default_objective_c_tools:
  - foundation
  - format
  - lint

# Default selection when no -e override is supplied. Override entirely with:
#   ansible-playbook site.yml -e '{"dev_languages":[{"name":"python","version":"3.11.9"}]}'
# or select via a simpler comma list with the helper var below.
dev_languages:
  - name: python
    version: "{{ default_python_version }}"
    pip_version: "{{ default_pip_version }}"
    pipx_version: "{{ default_pipx_version }}"
    # Set tools: [] to install no additional Python tools.
    # tools: "{{ default_python_tools }}"
    # Add venv definitions here when environments should be created.
    # venvs:
    #   - path: "{{ ansible_env.HOME }}/.venvs/project"
    #     system_site_packages: false
  - name: java
    version: "{{ default_java_version }}"
    distribution: "{{ default_java_distribution }}"
    default: true
  - name: javascript
    version: "{{ default_javascript_version }}"
    default: true
  - name: typescript
    version: "{{ default_typescript_version }}"
    default: true
  - name: ruby
    version: "{{ default_ruby_version }}"
    default: true
  - name: go
    version: "{{ default_go_version }}"
    default: true
  - name: rust
    version: "{{ default_rust_version }}"
    default: true
  # C#/.NET is optional; add a c# entry to install it.
  - name: powershell
    version: "{{ default_powershell_version }}"
    default: true
