---
- name: Set requested Lua version
  ansible.builtin.set_fact:
    lua_requested_version: "{{ dev_language.version | default(default_lua_version) }}"
    lua_selected_tools: "{{ dev_language.tools | default(default_lua_tools) }}"

- name: Require the latest Lua package-manager release
  ansible.builtin.assert:
    that: lua_requested_version == 'latest'
    fail_msg: "Only version 'latest' is supported for Lua."
    quiet: true

- name: Set Lua package names for Linux
  ansible.builtin.set_fact:
    lua_linux_runtime_package: "{{ 'lua5.4' if ansible_os_family in ['Debian', 'Alpine'] else 'lua' }}"
  when: ansible_system == 'Linux'

- name: Install Lua on Linux
  ansible.builtin.package:
    name: "{{ lua_linux_runtime_package }}"
    state: present
  become: true
  when: ansible_system == 'Linux'

- name: Install LuaRocks on Linux
  ansible.builtin.package:
    name: luarocks
    state: present
  become: true
  when:
    - ansible_system == 'Linux'
    - dev_language.tools | default(default_lua_tools) | length > 0

- name: Install Lua and LuaRocks on macOS
  community.general.homebrew:
    name: "{{ ['lua'] + (['luarocks'] if dev_language.tools | default(default_lua_tools) | length > 0 else []) }}"
    state: present
  when: ansible_system == 'Darwin'

- name: Check whether Lua is installed on Windows
  ansible.windows.win_command: where.exe lua.exe
  register: windows_lua_check
  changed_when: false
  failed_when: false
  when: ansible_system == 'Windows'

- name: Install Lua on Windows with winget
  ansible.windows.win_command:
    argv:
      - winget
      - install
      - --id
      - Lua.Lua
      - --exact
      - --accept-source-agreements
      - --accept-package-agreements
  when:
    - ansible_system == 'Windows'
    - windows_lua_check.rc != 0
  changed_when: true

- name: Check whether LuaRocks is installed on Windows
  ansible.windows.win_command: where.exe luarocks.bat
  register: windows_luarocks_check
  changed_when: false
  failed_when: false
  when:
    - ansible_system == 'Windows'
    - dev_language.tools | default(default_lua_tools) | length > 0

- name: Install LuaRocks on Windows with winget
  ansible.windows.win_command:
    argv:
      - winget
      - install
      - --id
      - LuaRocks.LuaRocks
      - --exact
      - --accept-source-agreements
      - --accept-package-agreements
  when:
    - ansible_system == 'Windows'
    - dev_language.tools | default(default_lua_tools) | length > 0
    - windows_luarocks_check.rc != 0
  changed_when: true

- name: Resolve latest StyLua release
  ansible.builtin.uri:
    url: https://api.github.com/repos/JohnnyMorganz/StyLua/releases/latest
    method: GET
    status_code: 200
  register: stylua_release
  when: "'stylua' in lua_selected_tools"

- name: Set StyLua release paths on Linux or macOS
  ansible.builtin.set_fact:
    stylua_archive: "/tmp/stylua-{{ stylua_release.json.tag_name }}.zip"
    stylua_binary: "{{ ansible_env.HOME }}/.local/bin/stylua"
    stylua_asset: "stylua-{{ 'macos' if ansible_system == 'Darwin' else 'linux' }}-{{ 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else 'x86_64' }}.zip"
  when:
    - ansible_system in ['Linux', 'Darwin']
    - "'stylua' in lua_selected_tools"

- name: Check whether StyLua is installed on Linux or macOS
  ansible.builtin.stat:
    path: "{{ stylua_binary }}"
  register: stylua_check
  when:
    - ansible_system in ['Linux', 'Darwin']
    - "'stylua' in lua_selected_tools"

- name: Create the StyLua binary directory on Linux or macOS
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"
  when:
    - ansible_system in ['Linux', 'Darwin']
    - "'stylua' in lua_selected_tools"
    - not stylua_check.stat.exists

- name: Download StyLua on Linux or macOS
  ansible.builtin.get_url:
    url: "https://github.com/JohnnyMorganz/StyLua/releases/download/{{ stylua_release.json.tag_name }}/{{ stylua_asset }}"
    dest: "{{ stylua_archive }}"
    mode: "0644"
  when:
    - ansible_system in ['Linux', 'Darwin']
    - "'stylua' in lua_selected_tools"
    - not stylua_check.stat.exists

- name: Install StyLua on Linux or macOS
  ansible.builtin.unarchive:
    src: "{{ stylua_archive }}"
    dest: "{{ ansible_env.HOME }}/.local/bin"
    remote_src: true
    mode: "0755"
  when:
    - ansible_system in ['Linux', 'Darwin']
    - "'stylua' in lua_selected_tools"
    - not stylua_check.stat.exists

- name: Add StyLua to Unix shell profiles
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - StyLua"
    create: true
    mode: "0644"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
  loop:
    - .bashrc
    - .profile
    - .zshrc
  when:
    - ansible_system in ['Linux', 'Darwin']
    - "'stylua' in lua_selected_tools"

- name: Set StyLua release paths on Windows
  ansible.builtin.set_fact:
    stylua_windows_dir: "C:\\DevLangs\\Lua\\bin"
    stylua_windows_archive: "C:\\Windows\\Temp\\stylua-{{ stylua_release.json.tag_name }}.zip"
  when:
    - ansible_system == 'Windows'
    - "'stylua' in lua_selected_tools"

- name: Check whether StyLua is installed on Windows
  ansible.windows.win_stat:
    path: "{{ stylua_windows_dir }}\\stylua.exe"
  register: stylua_windows_check
  when:
    - ansible_system == 'Windows'
    - "'stylua' in lua_selected_tools"

- name: Create the StyLua binary directory on Windows
  ansible.windows.win_file:
    path: "{{ stylua_windows_dir }}"
    state: directory
  when:
    - ansible_system == 'Windows'
    - "'stylua' in lua_selected_tools"
    - not stylua_windows_check.stat.exists

- name: Download StyLua on Windows
  ansible.windows.win_get_url:
    url: "https://github.com/JohnnyMorganz/StyLua/releases/download/{{ stylua_release.json.tag_name }}/stylua-windows-x86_64.zip"
    dest: "{{ stylua_windows_archive }}"
  when:
    - ansible_system == 'Windows'
    - "'stylua' in lua_selected_tools"
    - not stylua_windows_check.stat.exists

- name: Install StyLua on Windows
  community.windows.win_unzip:
    src: "{{ stylua_windows_archive }}"
    dest: "{{ stylua_windows_dir }}"
    delete_archive: false
  when:
    - ansible_system == 'Windows'
    - "'stylua' in lua_selected_tools"
    - not stylua_windows_check.stat.exists

- name: Add StyLua to the Windows PATH
  ansible.windows.win_path:
    elements:
      - "{{ stylua_windows_dir }}"
    scope: machine
    state: present
  when:
    - ansible_system == 'Windows'
    - "'stylua' in lua_selected_tools"

- name: Check installed LuaRocks tools on Linux or macOS
  ansible.builtin.command:
    argv:
      - luarocks
      - show
      - "{{ lua_tool }}"
  loop: "{{ dev_language.tools | default(default_lua_tools) }}"
  loop_control:
    loop_var: lua_tool
    label: "{{ lua_tool }}"
  register: unix_lua_tool_checks
  changed_when: false
  failed_when: false
  when:
    - ansible_system in ['Linux', 'Darwin']
    - lua_tool != 'luarocks'
    - lua_tool != 'stylua'

- name: Install missing LuaRocks tools on Linux or macOS
  ansible.builtin.command:
    argv:
      - luarocks
      - install
      - "{{ item.lua_tool }}"
  loop: >-
    {{ unix_lua_tool_checks.results | default([])
       | selectattr('rc', 'defined')
       | selectattr('rc', 'ne', 0)
       | list }}
  loop_control:
    label: "{{ item.lua_tool }}"
  when:
    - ansible_system in ['Linux', 'Darwin']
  changed_when: true

- name: Check installed LuaRocks tools on Windows
  ansible.windows.win_command:
    argv:
      - luarocks.bat
      - show
      - "{{ lua_tool }}"
  loop: "{{ dev_language.tools | default(default_lua_tools) }}"
  loop_control:
    loop_var: lua_tool
    label: "{{ lua_tool }}"
  register: windows_lua_tool_checks
  changed_when: false
  failed_when: false
  when:
    - ansible_system == 'Windows'
    - lua_tool != 'luarocks'
    - lua_tool != 'stylua'

- name: Install missing LuaRocks tools on Windows
  ansible.windows.win_command:
    argv:
      - luarocks.bat
      - install
      - "{{ item.lua_tool }}"
  loop: >-
    {{ windows_lua_tool_checks.results | default([])
       | selectattr('rc', 'defined')
       | selectattr('rc', 'ne', 0)
       | list }}
  loop_control:
    label: "{{ item.lua_tool }}"
  when:
    - ansible_system == 'Windows'
  changed_when: true

- name: Fail on unsupported operating system for Lua
  ansible.builtin.fail:
    msg: "Unsupported operating system for Lua install: {{ ansible_system }}"
  when: ansible_system not in ['Linux', 'Darwin', 'Windows']