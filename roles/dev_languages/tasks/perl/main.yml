---
- name: Set requested Perl version
  ansible.builtin.set_fact:
    perl_requested_version: "{{ dev_language.version | default(default_perl_version) }}"

- name: Require the latest Perl package-manager release
  ansible.builtin.assert:
    that: perl_requested_version == 'latest'
    fail_msg: "Only version 'latest' is supported for Perl."
    quiet: true

- name: Install Perl on Linux
  ansible.builtin.package:
    name:
      - perl
      - cpanminus
    state: present
  become: true
  when: ansible_system == 'Linux'

- name: Set Perl native build dependencies for Linux
  ansible.builtin.set_fact:
    perl_build_dependencies: >-
      {{ ['build-essential', 'libperl-dev'] if ansible_os_family == 'Debian' else
         (['base-devel'] if ansible_distribution == 'Archlinux' else
          (['build-base', 'perl-dev'] if ansible_distribution == 'Alpine' else
           ['gcc', 'make', 'perl-devel'])) }}
  when: ansible_system == 'Linux'

- name: Install Perl native build dependencies on Linux
  ansible.builtin.package:
    name: "{{ perl_build_dependencies }}"
    state: present
  become: true
  when:
    - ansible_system == 'Linux'
    - dev_language.tools | default(default_perl_tools) | length > 0

- name: Install Perl on macOS
  community.general.homebrew:
    name: perl
    state: present
  when: ansible_system == 'Darwin'

- name: Install Perl on Windows with winget
  ansible.windows.win_command:
    argv:
      - winget
      - install
      - --id
      - StrawberryPerl.StrawberryPerl
      - --exact
      - --accept-source-agreements
      - --accept-package-agreements
  when: ansible_system == 'Windows'
  changed_when: true

- name: Install Perl tools on Linux or macOS
  ansible.builtin.command:
    argv:
      - cpanm
      - --notest
      - "{{ perl_tool }}"
  loop: "{{ dev_language.tools | default(default_perl_tools) }}"
  loop_control:
    loop_var: perl_tool
    label: "{{ perl_tool }}"
  when:
    - ansible_system in ['Linux', 'Darwin']
    - dev_language.tools is not defined or perl_tool in dev_language.tools
  changed_when: true

- name: Install Perl tools on Windows
  ansible.windows.win_command:
    argv:
      - cpanm
      - --notest
      - "{{ perl_tool }}"
  loop: "{{ dev_language.tools | default(default_perl_tools) }}"
  loop_control:
    loop_var: perl_tool
    label: "{{ perl_tool }}"
  when:
    - ansible_system == 'Windows'
    - dev_language.tools is not defined or perl_tool in dev_language.tools
  changed_when: true