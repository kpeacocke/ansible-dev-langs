---
- name: Set requested Python version
  ansible.builtin.set_fact:
    python_requested_version: "{{ dev_language.version | default(default_python_version) }}"

- name: Resolve latest stable Python release
  ansible.builtin.uri:
    url: https://api.github.com/repos/python/cpython/tags?per_page=100
    method: GET
    return_content: true
    status_code: 200
  register: latest_python_release
  when: python_requested_version == 'latest'

- name: Set effective Python version to install
  ansible.builtin.set_fact:
    python_target_version: >-
      {{ (latest_python_release.json
          | map(attribute='name')
          | select('match', '^v[0-9]+\\.[0-9]+\\.[0-9]+$')
          | first
          | regex_replace('^v', ''))
         if python_requested_version == 'latest' else python_requested_version }}

- name: Install Python (Linux via pyenv)
  ansible.builtin.include_tasks: linux.yml
  when: ansible_system == 'Linux'

- name: Install Python (macOS via pyenv)
  ansible.builtin.include_tasks: macos.yml
  when: ansible_system == 'Darwin'

- name: Install Python (Windows via official installer)
  ansible.builtin.include_tasks: windows.yml
  when: ansible_system == 'Windows'

- name: Fail on unsupported operating system
  ansible.builtin.fail:
    msg: "Unsupported operating system for Python install: {{ ansible_system }}"
  when: ansible_system not in ['Linux', 'Darwin', 'Windows']

- name: Install pip for this Python version
  ansible.builtin.include_tasks: ../pip/main.yml
  when: dev_language.pip_version is defined

- name: Install pipx for this Python version
  ansible.builtin.include_tasks: ../pipx/main.yml
  when: dev_language.pipx_version is defined

- name: Create virtual environments for this Python version
  ansible.builtin.include_tasks: venv.yml
  loop: "{{ dev_language.venvs | default([]) }}"
  loop_control:
    loop_var: python_venv
    label: "{{ python_venv.path }}"
