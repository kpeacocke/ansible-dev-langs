---
- name: Set Unix .NET paths
  ansible.builtin.set_fact:
    dotnet_root: "{{ ansible_env.HOME }}/.dotnet"
    dotnet_install_script: "/tmp/dotnet-install.sh"

- name: Check whether dotnet is installed on Unix
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.dotnet/dotnet"
  register: dotnet_check

- name: Download Microsoft .NET install script
  ansible.builtin.get_url:
    url: https://dot.net/v1/dotnet-install.sh
    dest: "{{ dotnet_install_script }}"
    mode: "0755"
  when: not dotnet_check.stat.exists

- name: Install .NET SDK on Unix
  ansible.builtin.command:
    argv:
      - "{{ dotnet_install_script }}"
      - --install-dir
      - "{{ dotnet_root }}"
      - "{{ '--version' if dotnet_requested_version != 'latest' else '--channel' }}"
      - "{{ dotnet_requested_version if dotnet_requested_version != 'latest' else 'STS' }}"
  when: not dotnet_check.stat.exists
  changed_when: true

- name: Configure default .NET in Unix shell profiles
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - .NET"
    create: true
    mode: "0644"
    block: |
      export DOTNET_ROOT="{{ dotnet_root }}"
      export PATH="$DOTNET_ROOT:$HOME/.dotnet/tools:$PATH"
  loop:
    - .bashrc
    - .profile
    - .zshrc
  when: dev_language.default | default(false) | bool