---
- name: Set Unix Rustup installer path
  ansible.builtin.set_fact:
    rustup_installer: "/tmp/rustup-init-{{ rust_target }}"

- name: Check whether rustup is already installed
  ansible.builtin.stat:
    path: "{{ cargo_root }}/bin/rustup"
  register: rustup_check

- name: Download Rustup installer
  ansible.builtin.get_url:
    url: "https://static.rust-lang.org/rustup/dist/{{ rust_target }}/rustup-init"
    dest: "{{ rustup_installer }}"
    mode: "0755"
  when: not rustup_check.stat.exists

- name: Install Rust stable toolchain with rustup
  ansible.builtin.command:
    argv:
      - "{{ rustup_installer }}"
      - -y
      - --default-toolchain
      - "{{ 'stable' if rust_requested_version == 'latest' else rust_requested_version }}"
      - --profile
      - default
      - --no-modify-path
  when: not rustup_check.stat.exists
  changed_when: true

- name: Configure default Rust in Unix shell profiles
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Rust"
    create: true
    mode: "0644"
    block: |
      export PATH="{{ cargo_root }}/bin:$PATH"
  loop:
    - .bashrc
    - .profile
    - .zshrc
  when: dev_language.default | default(false) | bool