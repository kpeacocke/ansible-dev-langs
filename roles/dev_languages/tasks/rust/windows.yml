---
- name: Set Windows Rustup installer path
  ansible.builtin.set_fact:
    rustup_installer: "C:\\Windows\\Temp\\rustup-init.exe"
    cargo_root_windows: "{{ ansible_env.USERPROFILE }}\\.cargo"

- name: Check whether rustup is already installed on Windows
  ansible.windows.win_stat:
    path: "{{ cargo_root_windows }}\\bin\\rustup.exe"
  register: rustup_check

- name: Download Rustup installer on Windows
  ansible.windows.win_get_url:
    url: "https://static.rust-lang.org/rustup/dist/{{ rust_target }}/rustup-init.exe"
    dest: "{{ rustup_installer }}"
  when: not rustup_check.stat.exists

- name: Install Rust stable toolchain with rustup on Windows
  ansible.windows.win_command:
    argv:
      - "{{ rustup_installer }}"
      - -y
      - --default-toolchain
      - "{{ 'stable' if rust_requested_version == 'latest' else rust_requested_version }}"
      - --profile
      - default
  when: not rustup_check.stat.exists
  changed_when: true

- name: Add default Rust to the Windows PATH
  ansible.windows.win_path:
    elements:
      - "{{ cargo_root_windows }}\\bin"
    scope: machine
    state: present
  when: dev_language.default | default(false) | bool