---
- name: Set Unix Go installation paths
  ansible.builtin.set_fact:
    go_install_dir: "{{ go_root }}/{{ go_target_version }}"
    go_archive: "/tmp/{{ go_target_version }}.{{ go_platform }}-{{ go_architecture }}.{{ go_archive_extension }}"

- name: Check whether this Go version is installed
  ansible.builtin.stat:
    path: "{{ go_install_dir }}/bin/go"
  register: go_check

- name: Download Go archive
  ansible.builtin.get_url:
    url: "https://go.dev/dl/{{ go_target_version }}.{{ go_platform }}-{{ go_architecture }}.{{ go_archive_extension }}"
    dest: "{{ go_archive }}"
    mode: "0644"
  when: not go_check.stat.exists

- name: Create Go installation directory
  ansible.builtin.file:
    path: "{{ go_install_dir }}"
    state: directory
    mode: "0755"
  when: not go_check.stat.exists

- name: Extract Go archive
  ansible.builtin.unarchive:
    src: "{{ go_archive }}"
    dest: "{{ go_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
  when: not go_check.stat.exists

- name: Configure default Go in Unix shell profiles
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Go {{ go_target_version }}"
    create: true
    mode: "0644"
    block: |
      export PATH="{{ go_install_dir }}/bin:{{ go_install_dir }}/tools/bin:$PATH"
      export GOPATH="{{ go_install_dir }}/tools"
  loop:
    - .bashrc
    - .profile
    - .zshrc
  when: dev_language.default | default(false) | bool