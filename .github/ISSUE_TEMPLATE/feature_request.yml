name: Feature request
description: Suggest a language, tool, platform, or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the use case or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
      description: Describe the desired behavior. Add platform details or alternatives here if useful.
    validations:
      required: true
